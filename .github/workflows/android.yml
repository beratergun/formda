name: Android APK
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.BERXFIT_ANDROID_KEYSTORE_BASE64 != '' && secrets.BERXFIT_ANDROID_KEYSTORE_PASSWORD != '' && secrets.BERXFIT_ANDROID_KEY_ALIAS != '' && secrets.BERXFIT_ANDROID_KEY_PASSWORD != '' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.BERXFIT_ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BERXFIT_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.BERXFIT_ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.BERXFIT_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Require persistent berXfit signing secrets
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "Persistent berXfit release signing is required; no debug distribution fallback" >&2
          exit 1
      - name: Set signing file path
        run: echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/berxfit-release.p12" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test
      - run: node --test scripts/apk-certificates.test.mjs
      - run: npm run android:sync
      - name: Decode release keystore
        run: |
          python3 - <<'PY'
          import base64, os
          with open(os.environ['ANDROID_KEYSTORE_PATH'], 'wb') as key:
              key.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64']))
          PY
      - name: Build and lint signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease --no-daemon
      - name: Select APK and verify signature
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Release tag does not match source version" >&2
            exit 1
          fi
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/berXfit-v$VERSION.apk"
          echo "berXfit side-by-side release; persistent pinned certificate" >> "$GITHUB_STEP_SUMMARY"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "apk/berXfit-v$VERSION.apk"
          node scripts/check-apk.mjs "apk/berXfit-v$VERSION.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs-pem "apk/berXfit-v$VERSION.apk" > "$RUNNER_TEMP/berxfit-certificates.txt" 2>&1
          node scripts/check-apk-signing.mjs --identity android/signing-identity.json "$RUNNER_TEMP/berxfit-certificates.txt"
          echo "Certificate matches pinned berXfit identity; Formda remains a separate app" >> "$GITHUB_STEP_SUMMARY"
          (cd apk && sha256sum "berXfit-v$VERSION.apk" > "berXfit-v$VERSION.apk.sha256")
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: berXfit-android-apk
          path: apk/
      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" apk/*
      - name: Remove runner signing file
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi
