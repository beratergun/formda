name: Android APK
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Set signing file path
        run: echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/formda-release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.android/debug.keystore
          key: formda-debug-certificate-v1
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test
      - run: npm run android:sync
      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        run: |
          python3 - <<'PY'
          import base64, os
          with open(os.environ['ANDROID_KEYSTORE_PATH'], 'wb') as key:
              key.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64']))
          PY
      - name: Build and lint debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon
      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Select APK and verify signature
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Release tag does not match source version" >&2
            exit 1
          fi
          mkdir -p apk
          if [ "$HAS_SIGNING" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "apk/BERxFIT-v$VERSION.apk"
            echo "Release signing configured" >> "$GITHUB_STEP_SUMMARY"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "apk/BERxFIT-v$VERSION.apk"
            echo "Debug APK: Android development certificate; release secrets are not configured" >> "$GITHUB_STEP_SUMMARY"
          fi
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "apk/BERxFIT-v$VERSION.apk"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/formda-v2.apk" "https://github.com/beratergun/formda/releases/download/v2.0.0/Formda-v2.0.0.apk"
          PREVIOUS_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/formda-v2.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          CURRENT_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "apk/BERxFIT-v$VERSION.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ -z "$PREVIOUS_CERT" ] || [ "$PREVIOUS_CERT" != "$CURRENT_CERT" ]; then
            echo "APK certificate differs from v2.0.0; an in-place update is not verified" >&2
            exit 1
          fi
          echo "APK certificate matches v2.0.0; application ID retained" >> "$GITHUB_STEP_SUMMARY"
          (cd apk && sha256sum "BERxFIT-v$VERSION.apk" > "BERxFIT-v$VERSION.apk.sha256")
          node scripts/check-apk.mjs "apk/BERxFIT-v$VERSION.apk"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BERxFIT-android-apk
          path: apk/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BERxFIT-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" apk/*
      - name: Remove runner signing file
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi
